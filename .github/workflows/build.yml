name: Build DualWeb R619AC 128M (ImmortalWrt 24.10 ImageBuilder)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - "config/**"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: dualweb-r619ac-24.10-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gettext git libncurses-dev zlib1g-dev file wget curl \
            ca-certificates python3 rsync unzip zstd golang-go

      - name: Download official ImmortalWrt 24.10.5 ImageBuilder
        shell: bash
        run: |
          set -euxo pipefail
          URL="https://downloads.immortalwrt.org/releases/24.10.5/targets/ipq40xx/generic/immortalwrt-imagebuilder-24.10.5-ipq40xx-generic.Linux-x86_64.tar.zst"
          curl -fL --retry 3 --retry-delay 2 "$URL" -o imagebuilder.tar.zst
          mkdir imagebuilder
          tar --zstd -xf imagebuilder.tar.zst -C imagebuilder --strip-components=1
          test -f imagebuilder/Makefile
          cd imagebuilder
          echo "===== ImageBuilder version and target ====="
          grep -E '^(CONFIG_TARGET|CONFIG_VERSION|CONFIG_ARCH)' .config 2>/dev/null || true
          make info | tee ../imagebuilder-profiles.txt
          grep -i -B 2 -A 3 'p2w_r619ac-128m' ../imagebuilder-profiles.txt

      - name: Fetch DualWeb UI/API/overlay
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch test/openbox-artifacts https://github.com/wfzc6880530/dualweb.git dualweb
          test -f dualweb/src/main.go
          test -f dualweb/overlay/etc/uci-defaults/99-dualweb
          test -f dualweb/overlay/etc/init.d/dualweb-api
          test -f dualweb/overlay/etc/init.d/dualweb-firstboot
          test -f dualweb/overlay/usr/sbin/dualweb-firstboot-packages

      - name: Build DualWeb API for ARMv7
        shell: bash
        run: |
          set -euxo pipefail
          cd dualweb
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 \
            go build -trimpath -ldflags='-s -w' \
            -o overlay/usr/sbin/dualweb-api src/main.go
          file overlay/usr/sbin/dualweb-api
          chmod 0755 overlay/usr/sbin/dualweb-api
          chmod 0755 overlay/etc/uci-defaults/99-dualweb
          chmod 0755 overlay/etc/init.d/dualweb-api
          chmod 0755 overlay/etc/init.d/dualweb-firstboot
          chmod 0755 overlay/usr/sbin/dualweb-firstboot-packages

      - name: Build R619AC firmware with ImageBuilder
        shell: bash
        run: |
          set -euxo pipefail
          cd imagebuilder
          mkdir -p files
          cp -a ../dualweb/overlay/. files/
          chmod 0755 files/etc/uci-defaults/99-dualweb
          chmod 0755 files/etc/init.d/dualweb-api
          chmod 0755 files/etc/init.d/dualweb-firstboot
          chmod 0755 files/usr/sbin/dualweb-firstboot-packages

          echo "===== Confirm exact profile exists ====="
          make info > ../imagebuilder-profiles-final.txt
          grep -i -B 2 -A 3 'p2w_r619ac-128m' ../imagebuilder-profiles-final.txt

          # Use the official prebuilt ImageBuilder rather than rebuilding the kernel
          # or manipulating TARGET_DEVICE symbols through make defconfig.
          # ImageBuilder selects the device profile directly and avoids the failing
          # source-tree .config path entirely.
          PACKAGES="luci luci-base luci-mod-admin-full luci-theme-bootstrap luci-i18n-base-zh-cn luci-ssl-openssl nginx cgi-io rpcd rpcd-mod-ucode rpcd-mod-file uhttpd uhttpd-mod-ubus ca-bundle ca-certificates curl wget-ssl htop ip-full kmod-tun kmod-nft-tproxy firewall4 nftables dnsmasq-full block-mount fstools kmod-usb-storage kmod-fs-ext4 kmod-fs-vfat kmod-nls-cp437 kmod-nls-iso8859-1 libustream-openssl -libustream-mbedtls -libustream-wolfssl"

          echo "===== Build R619AC 128M images ====="
          make image PROFILE="p2w_r619ac-128m" PACKAGES="$PACKAGES" FILES="files"

      - name: Collect firmware and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p firmware
          find imagebuilder/bin/targets/ipq40xx/generic -maxdepth 1 -type f -print
          TARGET_DIR="imagebuilder/bin/targets/ipq40xx/generic"
          FACTORY="$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*p2w_r619ac-128m*squashfs-factory.ubi' -print -quit)"
          SYSUPGRADE="$(find "$TARGET_DIR" -maxdepth 1 -type f -name '*p2w_r619ac-128m*squashfs-sysupgrade.bin' -print -quit)"
          test -n "$FACTORY" || { echo 'ERROR: R619AC 128M factory.ubi not found'; exit 1; }
          test -n "$SYSUPGRADE" || { echo 'ERROR: R619AC 128M sysupgrade.bin not found'; exit 1; }
          cp "$FACTORY" firmware/
          cp "$SYSUPGRADE" firmware/
          cp "$TARGET_DIR"/profiles.json firmware/ 2>/dev/null || true
          cp "$TARGET_DIR"/sha256sums firmware/ 2>/dev/null || true
          cp "$TARGET_DIR"/*.manifest firmware/ 2>/dev/null || true
          cp "$TARGET_DIR"/version.buildinfo firmware/ 2>/dev/null || true
          cd firmware
          sha256sum * > SHA256SUMS.local
          ls -lah
          cat SHA256SUMS.local

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DualWeb-ImmortalWrt-24.10.5-R619AC-128M
          path: firmware/
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        shell: bash
        run: |
          df -h
          echo "Base: official ImmortalWrt 24.10.5 ImageBuilder"
          echo "Target: ipq40xx/generic / p2w_r619ac-128m"
          echo "TLS backend preference: libustream-openssl"
          echo "DualWeb API: ARMv7"
